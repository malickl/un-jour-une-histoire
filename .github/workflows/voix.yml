name: Generer la voix

on:
  push:
    paths:
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer edge-tts
        run: pip install edge-tts

      - name: Generer les voix manquantes
        run: python generer_voix.py

      - name: Enregistrer les MP3
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add voix
          git diff --staged --quiet || (git commit -m "Voix generee" && git push)
