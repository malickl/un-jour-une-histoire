name: Telecharger les clips

on:
  push:
    paths:
      - "clips/requests/**"
      - "fetch_clips.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Telecharger et recadrer
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python3 fetch_clips.py
      - name: Enregistrer les clips
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add clips/out
          git diff --cached --quiet || (git commit -m "Clips telecharges" && git pull --rebase -q && git push)
